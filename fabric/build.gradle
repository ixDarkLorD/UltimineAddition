apply from: "${rootProject.sharedScripts}/fabric.gradle"

loom {
    runs {
        devClient {
            client()
            setConfigName("Fabric Dev Client ${libs.versions.minecraft.get()}")
            programArgs "--username", "Dev"
        }
        server {
            runDir("../run/server")
        }
    }
}

// Fabric API 0.116.5+1.21.1 publishes fabric-loot-api-v2 with dependencies on modules of a newer Minecraft
// (fabric-resource-loader-v0 2.0.0, fabric-api-base 0.4.43), which Gradle then picks over the ones the API itself
// ships. With them a dev world doesn't load (Trinkets: NoSuchFieldError ResourceReloadListenerKeys.TAGS) and a dev
// server doesn't start (LanguageMixin), so those two dependencies are dropped from that module: the API brings its own.
// Jars are not affected.
dependencies.components.withModule("net.fabricmc.fabric-api:fabric-loot-api-v2") {
    allVariants {
        withDependencies { deps -> deps.removeAll { it.name in ["fabric-resource-loader-v0", "fabric-api-base"] } }
    }
}

dependencies {
    // CoolCatLib (constructors, events, networking, registries, configs, attachments) and Canvas (GUI widgets,
    // render utilities, easing), published from ../CoolCatLib-1.21.
    modApi "net.ixdarklord.coolcatlib:coolcatlib-fabric:${libs.versions.minecraft.get()}-${coolcatlib_version}"

    modCompileOnlyApi libs.jei.api.fabric
    modRuntimeOnly libs.jei.fabric
    modCompileOnly libs.trinkets.fabric
    // In dev runs too, to test the Skills Record slot (it brings Cardinal Components along).
    modLocalRuntime libs.trinkets.fabric

    modApi "dev.ftb.mods:ftb-ultimine-fabric:${ftbultimine_version}"
    modApi "dev.ftb.mods:ftb-library-fabric:${ftblibrary_version}"
}
