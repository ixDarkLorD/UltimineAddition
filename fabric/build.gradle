apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v3/fabric.gradle"

loom {
    runs {
        devClient {
            client()
            setConfigName("Fabric Dev Client ${libs.versions.minecraft.get()}")
            programArgs "--username", "Dev"
        }
        server {
            runDir("../run/server")
        }
    }
}

dependencies {
    // CoolCatLib: Core (constructors, events, networking, registries, configs, attachments) and Canvas (GUI widgets,
    // render utilities, easing), published from ../CoolCatLib-26.1.2.
    api "net.ixdarklord.coolcatlib:coolcatlib-core-fabric:${libs.versions.minecraft.get()}-${coolcatlib_version}"
    api "net.ixdarklord.coolcatlib:coolcatlib-canvas-fabric:${libs.versions.minecraft.get()}-${coolcatlib_version}"

    // Dev runs: the loader JEI 29.43 settles on brings sponge-mixin 0.17.4, which crashes MixinExtras 0.5.4 (a
    // ClassCastException in FactoryRedirectWrapperMixinTransformer on this mod's @Redirects); the catalog's 0.5.5 works.
    runtimeOnly "io.github.llamalad7:mixinextras-fabric:${libs.versions.mixinextras.version.get()}"

    compileOnlyApi libs.jei.api.fabric
    runtimeOnly libs.jei.fabric
    compileOnly libs.trinkets
    // Trinkets injects interfaces into vanilla classes, so dev runs need it on the runtime classpath too.
    localRuntime libs.trinkets

    api "dev.ftb.mods:ftb-ultimine-fabric:${ftbultimine_version}"
    api "dev.ftb.mods:ftb-library-fabric:${ftblibrary_version}"

    // MCP Bridge (../MCPBridge-26.1.2) in dev runs only, when it's been published to Maven Local: lets Claude Code
    // drive the running game (its MCP server is registered in Claude Code as "minecraft"). Never part of the built jar.
    if (new File("${System.getProperty('user.home')}/.m2/repository/net/ixdarklord/mcp_bridge").exists()) {
        localRuntime "net.ixdarklord.mcp_bridge:mcp_bridge-fabric:${libs.versions.minecraft.get()}-1"
    }
}
