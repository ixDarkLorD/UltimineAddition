apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v3/neoforge.gradle"

loom {
    runs {
        devClient {
            client()
            setConfigName("NeoForge Dev Client ${libs.versions.minecraft.get()}")
            programArgs "--username", "Dev"
        }
        server {
            runDir("../run/server")
        }
        // NeoForge 26.1 split datagen into client/server runs; the client run generates everything.
        data {
            clientData()
        }
    }
}

dependencies {
    // CoolCatLib: Core (constructors, events, networking, registries, configs, attachments) and Canvas (GUI widgets,
    // render utilities, easing), published from ../CoolCatLib-26.1.2.
    api "net.ixdarklord.coolcatcore:coolcatcore-neoforge:${libs.versions.minecraft.get()}-${coolcatlib_version}"
    api "net.ixdarklord.coolcatcanvas:coolcatcanvas-neoforge:${libs.versions.minecraft.get()}-${coolcatlib_version}"

    compileOnly "${libs.curios.neoforge.get()}:api"
    runtimeOnly libs.curios.neoforge

    compileOnlyApi libs.jei.api.neoforge
    runtimeOnly libs.jei.neoforge

    // Configured (MrCrayfish): in-game config screens for dev runs. Not in the shared catalog; CurseForge file for 26.1.2 (v2.7.5).
    localRuntime "curse.maven:configured-457570:7943180"

    api "dev.ftb.mods:ftb-ultimine-neoforge:${ftbultimine_version}"
    api "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"

    // MCP Bridge (../MCPBridge-26.1.2) in dev runs only, when it's been published to Maven Local: lets Claude Code
    // drive the running game (its MCP server is registered in Claude Code as "minecraft"). Never part of the built jar.
    if (new File("${System.getProperty('user.home')}/.m2/repository/net/ixdarklord/mcp_bridge").exists()) {
        localRuntime "net.ixdarklord.mcp_bridge:mcp_bridge-neoforge:${libs.versions.minecraft.get()}-1"
    }
}
