apply from: "${rootProject.sharedScripts}/neoforge.gradle"

loom {
    runs {
        devClient {
            client()
            setConfigName("NeoForge Dev Client ${libs.versions.minecraft.get()}")
            programArgs "--username", "Dev"
        }
        server {
            runDir("../run/server")
        }
    }
}

dependencies {
    // CoolCatLib: Core (constructors, events, networking, registries, configs, attachments) and Canvas (GUI widgets,
    // render utilities, easing), published from ../CoolCatLib-1.21.
    modApi "net.ixdarklord.coolcatlib:coolcatlib-core-neoforge:${libs.versions.minecraft.get()}-${coolcatlib_version}"
    modApi "net.ixdarklord.coolcatlib:coolcatlib-canvas-neoforge:${libs.versions.minecraft.get()}-${coolcatlib_version}"

    modCompileOnly "${libs.curios.neoforge.get()}:api"
    modRuntimeOnly libs.curios.neoforge

    modCompileOnlyApi libs.jei.api.neoforge
    modRuntimeOnly libs.jei.neoforge

    modApi "dev.ftb.mods:ftb-ultimine-neoforge:${ftbultimine_version}"
    modApi "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"
}
