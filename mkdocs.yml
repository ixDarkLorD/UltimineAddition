site_name: FTB Ultimine Addition
site_description: "Earn Ultimine: Mining Skill Cards, the Skills Record, certificates and Mine-Go Juice for FTB Ultimine."
site_author: ixDarkLorD
site_url: https://ixdarklord.github.io/UltimineAddition/
repo_url: https://github.com/ixDarkLorD/UltimineAddition
repo_name: ixDarkLorD/UltimineAddition
edit_uri: edit/docs/docs/
copyright: "Made by ixDarkLorD"

theme:
  name: material
  custom_dir: overrides
  logo: assets/favicon.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Rubik
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

hooks:
  - hooks/changelog.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/menu.js

extra:
  # The Menu's icons for pages without one of their own, by title (overrides/partials/header.html). The pages' own
  # icons and the descriptions shown in the Menu are in their front matter.
  menu_icons:
    Home: material/home-outline
    Changelog: material/history
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ixDarkLorD/UltimineAddition
      name: Source on GitHub
    - icon: simple/curseforge
      link: https://www.curseforge.com/minecraft/mc-mods/ultimine-addition
      name: FTB Ultimine Addition on CurseForge

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Wiki:
      - wiki/index.md
      - Getting Started: wiki/getting-started.md
      - Walkthrough: wiki/walkthrough.md
      - Mining Skill Cards: wiki/mining-skill-cards.md
      - Skills Record: wiki/skills-record.md
      - Certificates and Mine-Go Juice: wiki/unlocking-ultimine.md
      - Ultimine Undo: wiki/undo.md
      - For Pack Makers:
          - Configuration: wiki/packs/configuration.md
          - Challenges: wiki/packs/challenges.md
          - Ultimine Shapes: wiki/packs/shapes.md
          - Custom Cards: wiki/packs/custom-cards.md
  - Docs:
      - docs/index.md
      - Data Packs: docs/data-packs.md
      - Commands: docs/commands.md
      - Items and Ids: docs/items.md
      - Translation Keys: docs/translations.md
  - Changelog: changelog.md
