plugins {
    alias libs.plugins.architectury.loom.noremap apply false
    alias libs.plugins.architectury.plugin apply false
    alias libs.plugins.shadow apply false
    alias libs.plugins.modpublisher apply false
}

allprojects {
    repositories {
        maven {
            url "https://maven.saps.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
            }
        }
        maven {
            url "https://maven.saps.dev/snapshots"
            content {
                includeGroup "dev.latvian.mods"
            }
        }
        maven {
            url "https://maven.ftb.dev/releases"
            content {
                includeGroup "dev.ftb.mods"
            }
        }

        maven {
            url "https://maven.ftb.dev/snapshots"
            content {
                includeGroup "dev.ftb.mods"
            }
        }
    }
}

// The shared scripts apply "com.github.johnrengelman.shadow", which GradleUp's Shadow only keeps as a
// marker ID, so the real plugin must be applied before them (see settings.gradle).
subprojects {
    apply plugin: "com.gradleup.shadow"
}

apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v3/main.gradle"

// The 26.1.2-v2 catalog brings GradleUp Shadow 9, whose shadowJar packs the whole runtime classpath unless told
// otherwise. Common's jar only holds its own classes; the loader jars shade it in through shadowCommon.
project(":common") {
    afterEvaluate {
        tasks.named("shadowJar") {
            configurations = []
        }
    }
}
