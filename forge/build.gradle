apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v1/forge.gradle"

loom {
    runs {
        devClient {
            client()
            setConfigName("Forge Dev Client ${libs.versions.minecraft.get()}")
            programArgs "--username", "Dev"
        }
        server {
            runDir("../run/server")
        }
    }
}

dependencies {
    modApi libs.architectury.forge.get()
    modApi "net.ixdarklord.coolcatlib:coolcatlib-forge:1.20.1-${coolcatlib_version}"

    modCompileOnly "${libs.curios.forge.get()}:api"
    modRuntimeOnly libs.curios.forge.get()

    modCompileOnlyApi libs.jei.api.forge.get()
    modRuntimeOnly libs.jei.forge.get()

    modApi "dev.ftb.mods:ftb-ultimine-forge:${ftbultimine_version}"
    modApi "dev.ftb.mods:ftb-library-forge:${ftblibrary_version}"
}
