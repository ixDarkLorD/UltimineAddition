apply from: "${rootProject.sharedScripts}/forge.gradle"

loom {
    runs {
        devClient {
            client()
            setConfigName("Forge Dev Client ${libs.versions.minecraft.get()}")
            programArgs "--username", "Dev"
        }
        server {
            runDir("../run/server")
        }
    }
}

dependencies {
    // CoolCatLib: Core (constructors, events, networking, registries, configs, attachments) and Canvas (GUI widgets,
    // render utilities, easing), published from ../CoolCatLib-1.20.1.
    modApi "net.ixdarklord.coolcatlib:coolcatlib-core-forge:${libs.versions.minecraft.get()}-${coolcatlib_version}"
    modApi "net.ixdarklord.coolcatlib:coolcatlib-canvas-forge:${libs.versions.minecraft.get()}-${coolcatlib_canvas_version}"

    modCompileOnly "${libs.curios.forge.get()}:api"
    modRuntimeOnly libs.curios.forge

    modCompileOnlyApi libs.jei.api.forge
    modRuntimeOnly libs.jei.forge

    modApi "dev.ftb.mods:ftb-ultimine-forge:${ftbultimine_version}"
    modApi "dev.ftb.mods:ftb-library-forge:${ftblibrary_version}"
}
