apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v3/common.gradle"

dependencies {
    api libs.architectury.common
    api "net.ixdarklord.coolcatlib:coolcatlib-common:${libs.versions.minecraft.get()}-${coolcatlib_version}"
    api libs.forgeconfigapiport.common
    api libs.jei.libs.common
    api libs.jei.api.common
    // JEI internals (client-synced recipes); the loader-specific JEI jars provide them at runtime.
    compileOnly "mezz.jei:jei-${libs.versions.minecraft.get()}-common:${libs.versions.jei.get()}"

    api "dev.ftb.mods:ftb-ultimine:${ftbultimine_version}"
    api "dev.ftb.mods:ftb-library:${ftblibrary_version}"
}
