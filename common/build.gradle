apply from: "${rootProject.sharedScripts}/common.gradle"

dependencies {
    // CoolCatLib: Core (constructors, events, networking, registries, configs, attachments) and Canvas (GUI widgets,
    // render utilities, easing), published from ../CoolCatLib-1.21.
    modApi "net.ixdarklord.coolcatlib:coolcatlib-core-common:${libs.versions.minecraft.get()}-${coolcatlib_version}"
    modApi "net.ixdarklord.coolcatlib:coolcatlib-canvas-common:${libs.versions.minecraft.get()}-${coolcatlib_canvas_version}"
    modApi libs.jei.libs.common
    modApi libs.jei.api.common

    modApi "dev.ftb.mods:ftb-ultimine:${ftbultimine_version}"
    modApi "dev.ftb.mods:ftb-library:${ftblibrary_version}"
}

// The shared main.gradle publishes every subproject's shadowJar. For common it must be a plain jar of this
// module's own classes (Shadow's default bundles the whole runtime classpath under an "-all" classifier).
shadowJar {
    configurations = []
    archiveClassifier = null
}
